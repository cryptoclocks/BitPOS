# NEAR HACKATHON work (2026-11-14). See near-hackathon/PROVENANCE.md.
[package]
name = "near-bills"
description = "BitPOS Living Bill: exact-amount stablecoin bills with witness escrow and atomic split payouts"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cryptoclocks/BitPOS"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
