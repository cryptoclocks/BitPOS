<!doctype html><html lang="en"><head><meta charset="utf-8"><title>BitPOS idle concept</title><style>@font-face{font-family:Montserrat;src:url('../fonts/Montserrat-Medium.ttf')}@font-face{font-family:Sarabun;src:url('../fonts/Sarabun-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#281039;color:#fff;font-family:Montserrat,Arial}main{width:480px;height:320px;padding:20px;display:flex;flex-direction:column;position:relative;overflow:hidden}.brand{width:104px;background:#fff8f0;border-radius:4px;padding:5px}header{display:flex;align-items:center;justify-content:space-between}header span{font-size:10px;color:#cbb0d8}h1{font-size:27px;line-height:1.2;margin:24px 0 10px}p{font-size:14px;color:#d8c4e1;line-height:1.5;margin:5px 0}.amount{font-size:42px;color:#ffaa52;margin:14px 0}.status{color:#51d1a4}.warning{color:#ffaa52}footer{margin-top:auto;font-size:10px;color:#a887bd}.row{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid #6b437a;padding:8px 0}.icon{width:45px;height:45px;filter:brightness(0) invert(1)}.loader{animation:spin 1.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader{animation:none}}</style></head><body><main><header><img class="brand" src="../brand/bitpos-logo-large.png" alt="BitPOS"><span>CAFE COUNTER</span></header><h1>Welcome to BitPOS</h1><p>Your next coffee, connected.</p><img class="icon " src="../icons/coffee.svg" alt=""><footer>INTERFACE CONCEPT · 480 × 320 · NOT A LIVE PAYMENT</footer></main></body></html>
