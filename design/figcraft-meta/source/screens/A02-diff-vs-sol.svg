<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1200" viewBox="0 0 1600 1200"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#FFFFFF"/><text x="64" y="90" font-family="Noto Sans Thai" font-size="34" font-weight="700" fill="#1C2B33" text-anchor="start">meta- ต่างจาก sol- อย่างไร</text><text x="64" y="128" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#65676B" text-anchor="start">รายละเอียดเต็มอยู่ใน reports/diff-vs-sol.md · sol- = BitPOS-Platform-UI.figcraft (ไฟล์ของฝั่ง Solana, อ่านอย่างเดียว)</text><rect x="64" y="170" width="476" height="560" rx="16" fill="#FFFFFF" stroke="#DADDE1" stroke-width="1"/><rect x="88" y="196" width="285.2" height="32" rx="16.0" fill="#FDECEF"/><text x="230.6" y="216.5" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#D3203A" text-anchor="middle">ตัดออก (คริปโต / ไม่เกี่ยวกับงานนี้)</text><text x="88" y="268.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• กระเป๋าเงิน Phantom / เลือกสินทรัพย์ (W07,</text><text x="88" y="292.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">WD03–WD07)</text><text x="88" y="342.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• USDG / USDC / USDT-test, Solana devnet</text><text x="88" y="416.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• x402 (WD21), PromptPay ที่ยังไม่เปิด (W08,</text><text x="88" y="440.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">WD17)</text><text x="88" y="490.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• ยอดโอนคริปโต (P38) → ยอดจาก Stripe</text><text x="88" y="564.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• จัดส่ง/ไรเดอร์ (P32, P40, R01–R32)</text><text x="88" y="588.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">ไม่อยู่ในงานนี้</text><text x="88" y="638.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• แอปลูกค้า Flutter (U01–U43) ไม่อยู่ในงานนี้</text><rect x="564" y="170" width="476" height="560" rx="16" fill="#FFFFFF" stroke="#DADDE1" stroke-width="1"/><rect x="588" y="196" width="76.4" height="32" rx="16.0" fill="#FFF4D6"/><text x="626.2" y="216.5" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#8A5A00" text-anchor="middle">เปลี่ยน</text><text x="588" y="268.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• ธีมม่วง → ฟ้า Meta + สีไล่ Muse</text><text x="588" y="342.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• วิธีชำระ (W06) → Stripe Checkout อย่างเดียว</text><text x="588" y="416.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• ศูนย์ออเดอร์ (P29) → แยกช่องทาง แตะ / แชท /</text><text x="588" y="440.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">AI / โต๊ะ / หน้าร้าน</text><text x="588" y="490.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• โปรโมชัน (P33–P34) → Muse Spark ร่าง +</text><text x="588" y="514.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">อนุมัติ + Allow All</text><text x="588" y="564.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• โต๊ะและ BitPOS Mini (P35) → มีสติกเกอร์ NTAG</text><text x="588" y="588.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">+ ลิงก์จอโต๊ะ</text><text x="588" y="638.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• รายงาน 7 หน้า (P14–P20) → รวมเป็นหน้าเดียว</text><text x="588" y="662.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">แยกตามช่องทาง</text><rect x="1064" y="170" width="476" height="560" rx="16" fill="#FFFFFF" stroke="#DADDE1" stroke-width="1"/><rect x="1088" y="196" width="141.2" height="32" rx="16.0" fill="#E6F4EA"/><text x="1158.6" y="216.5" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#1E8E3E" text-anchor="middle">เพิ่มใหม่ (Meta)</text><text x="1088" y="268.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• แตะ NFC + ยินยอมใน Messenger (C01–C04, C16)</text><text x="1088" y="342.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• สั่ง/จองโต๊ะ/ใบเสร็จ ในแชท (C08–C15)</text><text x="1088" y="416.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• จอโต๊ะนับถอยหลัง (T01–T04) + Mini (B07–B09)</text><text x="1088" y="490.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• หลักฐาน AI (MP17) · Muse Connector / MCP</text><text x="1088" y="514.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">(MP23)</text><text x="1088" y="564.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• การจองโต๊ะ (MP08) · ลูกค้าที่ยินยอม</text><text x="1088" y="588.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">(MP15–MP16)</text><text x="1088" y="638.0" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">• สั่งด้วยเสียง (C11)</text><text x="64" y="790" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">หน้าที่คงเดิมจาก sol- (ปรับธีมและตัดคริปโต): ภาพรวม · หน้าขาย · คิวครัว · บิล/รายละเอียด · สินค้า · สต็อก · ลูกค้า · ผู้ใช้และสิทธิ์ · ตั้งค่า · คืนเงิน · เข้าสู่ระบบ</text><text x="64" y="822" font-family="Noto Sans Thai" font-size="15" font-weight="400" fill="#1C2B33" text-anchor="start">หน้าที่ sol- มีแต่ meta- รวมไว้ในหน้าอื่น: ปิดรอบขาย, รับเข้าสินค้า, ปรับสต็อก, สินค้าใกล้หมด, ซัพพลายเออร์, หมวดสินค้า, ประวัติใช้งาน, เครื่องพิมพ์, สาขา</text><g><rect x="64" y="1100" width="200" height="48" rx="12" fill="#FFFFFF" stroke="#DADDE1" stroke-width="1"/><text x="164.0" y="1129.4" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#1C2B33" text-anchor="middle">← เริ่มที่นี่</text></g><rect id="Hotspot → A00" x="64" y="1100" width="200" height="48" rx="0" fill="#FFFFFF" fill-opacity="0"/></svg>