<text x="1080" y="150" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">How payroll by the cup works</text>
<circle cx="1096" cy="196" r="14" fill="#0B1020"/>
<text x="1096" y="201" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="1124" y="200" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Clock in</text>
<text x="1124" y="222" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="1124" dy="0">The server notes who is on shift. No</tspan><tspan x="1124" dy="19">money moves.</tspan></text>
<circle cx="1096" cy="292" r="14" fill="#0B1020"/>
<text x="1096" y="297" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1124" y="296" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">A bill is paid</text>
<text x="1124" y="318" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="1124" dy="0">The bill lists each person on shift with a</tspan><tspan x="1124" dy="19">share.</tspan></text>
<circle cx="1096" cy="388" r="14" fill="#0B1020"/>
<text x="1096" y="393" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1124" y="392" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">The contract pays</text>
<text x="1124" y="414" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="1124" dy="0">Shares land in each person's own</tspan><tspan x="1124" dy="19">account, in the owner's receipt.</tspan></text>
<circle cx="1096" cy="484" r="14" fill="#0B1020"/>
<text x="1096" y="489" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1124" y="488" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Nobody holds NEAR</text>
<text x="1124" y="510" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="1124" dy="0">The café's relayer pays the network fee</tspan><tspan x="1124" dy="19">for staff too.</tspan></text>
