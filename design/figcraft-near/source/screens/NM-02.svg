<text x="1028" y="615" font-family="Noto Sans Thai" font-size="14" font-weight="700" fill="#00704F">Checked on chain, not just here</text>
<text x="1004" y="642" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Amounts are whole token units, never fractions.</text>
<text x="1004" y="662" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">The contract refuses a bill whose payouts do not</text>
<text x="1004" y="682" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">add up to its total, or that lists more than ten</text>
<text x="1004" y="702" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">recipients. Every recipient is registered first.</text>
