<rect x="1138.43" y="30" width="154.09" height="24" rx="12" fill="#EEF0EA"/>
<text x="1148.43" y="45.96" font-family="Noto Sans Thai" font-size="11" font-weight="600" fill="#5E6B7A">orbit.bitpos-near.testnet</text>
</g>
</g>
<text id="footer" x="1416" y="988" font-family="Noto Sans Thai" font-size="11" font-weight="400" fill="#5E6B7A" text-anchor="end">FigCraft concept · sample data · NEAR testnet</text>
<rect id="step-card" x="280" y="112" width="270" height="168" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="318" cy="150" r="14" fill="#00B37E"/>
<path d="M311 150 L316.25 154.9 L325 145.8" fill="none" stroke="#0B1020" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round"/>
<text x="342" y="155" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Step 1</text>
<text x="304" y="200" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">Shop account</text>
<text x="304" y="226" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">orbit.bitpos-near.testnet</text>
<text x="304" y="250" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">Created · a readable name</text>
<rect id="step-card-2" x="566" y="112" width="270" height="168" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="604" cy="150" r="14" fill="#00B37E"/>
<path d="M597 150 L602.25 154.9 L611 145.8" fill="none" stroke="#0B1020" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round"/>
<text x="628" y="155" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Step 2</text>
<text x="590" y="200" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">Token</text>
<text x="590" y="226" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">tUSD (test) and Circle USDC testnet</text>
<text x="590" y="250" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">Both allowed in the bills contract</text>
<rect id="step-card-3" x="852" y="112" width="270" height="168" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="890" cy="150" r="14" fill="#00B37E"/>
<path d="M883 150 L888.25 154.9 L897 145.8" fill="none" stroke="#0B1020" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round"/>
<text x="914" y="155" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Step 3</text>
<text x="876" y="200" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">Recipients</text>
<text x="876" y="226" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">5 of 5 registered on the token</text>
<text x="876" y="250" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">Owner, tax, Mai, Ton, Milk Farm Co-op</text>
<rect id="step-card-4" x="1138" y="112" width="270" height="168" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="1176" cy="150" r="14" fill="#00B37E"/>
<path d="M1169 150 L1174.25 154.9 L1183 145.8" fill="none" stroke="#0B1020" stroke-width="2.52" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1200" y="155" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Step 4</text>
<text x="1162" y="200" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">Witness device</text>
<text x="1162" y="226" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Mini-01 · key registered</text>
<text x="1162" y="250" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">Witness mode on · refund after 2:00</text>
<rect id="keys-card" x="280" y="296" width="1128" height="484" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="315.5" cy="332" r="4.2" fill="none" stroke="#0B1020" stroke-width="1.8"/>
<path d="M319.7 332 H329 V335.8 M324.5 332 V335" fill="none" stroke="#0B1020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="342" y="338" font-family="Noto Sans Thai" font-size="18" font-weight="700" fill="#0B1020">Keys with the least power</text>
<text x="304" y="362" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">No automated part of BitPOS holds a key that can move the shop's money.</text>
<g id="table">
<rect x="304" y="384" width="1080" height="36" rx="8" fill="#EEF0EA"/>
<text x="318" y="406" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Key</text>
<text x="508" y="406" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">Held by</text>
<text x="698" y="406" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">What it can do</text>
<text x="1070" y="406" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A">What it cannot do</text>
<text x="318" y="453.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Owner key</text>
<text x="508" y="453.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Your own wallet</text>
<text x="698" y="453.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Everything. Used only by you, for setup and withdrawals.</text>
<text x="1070" y="453.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#00704F">Never stored by BitPOS</text>
<line x1="304" y1="478" x2="1384" y2="478" stroke="#DDE2D8" stroke-width="1"/>
<text x="318" y="511.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Cashier key</text>
<text x="508" y="511.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">BitPOS server</text>
<text x="698" y="511.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Call open_bill and void_bill on the bills contract.</text>
<text x="1070" y="511.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Cannot transfer tokens or NEAR</text>
<line x1="304" y1="536" x2="1384" y2="536" stroke="#DDE2D8" stroke-width="1"/>
<text x="318" y="569.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Relayer key</text>
<text x="508" y="569.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">BitPOS relayer</text>
<text x="698" y="569.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Pay network fees for payments into the bills contract.</text>
<text x="1070" y="569.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Refuses any other transaction</text>
<line x1="304" y1="594" x2="1384" y2="594" stroke="#DDE2D8" stroke-width="1"/>
<text x="318" y="627.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Witness key</text>
<text x="508" y="627.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">BitPOS Mini</text>
<text x="698" y="627.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Sign "I showed PAID for this bill".</text>
<text x="1070" y="627.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Not a NEAR account. Signs only.</text>
<line x1="304" y1="652" x2="1384" y2="652" stroke="#DDE2D8" stroke-width="1"/>
<text x="318" y="685.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">CFO key</text>
<text x="508" y="685.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Café CFO agent</text>
<text x="698" y="685.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Call propose with a preset id.</text>
<text x="1070" y="685.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Cannot approve or move money</text>
<line x1="304" y1="710" x2="1384" y2="710" stroke="#DDE2D8" stroke-width="1"/>
<text x="318" y="743.68" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Staff keys</text>
<text x="508" y="743.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Each staff phone</text>
<text x="698" y="743.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Withdraw from their own account.</text>
<text x="1070" y="743.68" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Cannot touch the shop account</text>
<line x1="304" y1="768" x2="1384" y2="768" stroke="#DDE2D8" stroke-width="1"/>
</g>
<rect id="finish-card" x="280" y="796" width="1128" height="144" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<text x="304" y="838" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">Ready to take bills</text>
<text x="304" y="862" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Open a table menu, pay with the demo wallet and watch the bill split itself.</text>
<text x="304" y="900" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">Everything here is NEAR testnet and test money. Mainnet is not enabled.</text>
<g id="finish-button">
<rect x="1184" y="836" width="200" height="48" rx="24" fill="#00B37E"/>
<text x="1284" y="865.4" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020" text-anchor="middle">Finish setup</text>
</g>
<rect id="hotspot__NM-01__2" x="1184" y="836" width="200" height="48" fill="#000000" fill-opacity="0"/>
</svg>
