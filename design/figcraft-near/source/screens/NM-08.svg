<text x="880" y="232" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">bills witnessed</text>
<text x="1048" y="208" font-family="Noto Sans Thai" font-size="28" font-weight="700" fill="#0B1020">1.8 s</text>
<text x="1048" y="232" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">median, paid to signed</text>
<text x="1216" y="208" font-family="Noto Sans Thai" font-size="28" font-weight="700" fill="#0B1020">1</text>
<text x="1216" y="232" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">refund for no witness</text>
