<rect id="flow-card" x="280" y="648" width="1128" height="292" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<text x="304" y="686" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">How the witness works</text>
<rect x="304" y="710" width="203.2" height="150" rx="12" fill="#F6F7F2"/>
<circle cx="332" cy="740" r="14" fill="#0B1020"/>
<text x="332" y="745" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="320" y="782" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Customer pays</text>
<text x="320" y="804" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A"><tspan x="320" dy="0">Exact amount lands in the bill.</tspan><tspan x="320" dy="17">State: Escrow.</tspan></text>
<rect x="523.2" y="710" width="203.2" height="150" rx="12" fill="#F6F7F2"/>
<circle cx="551.2" cy="740" r="14" fill="#0B1020"/>
<text x="551.2" y="745" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="539.2" y="782" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Screen asks the chain</text>
<text x="539.2" y="804" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A"><tspan x="539.2" dy="0">The Mini calls a NEAR RPC</tspan><tspan x="539.2" dy="17">view itself. It does not trust</tspan><tspan x="539.2" dy="17">the server.</tspan></text>
<rect x="742.4" y="710" width="203.2" height="150" rx="12" fill="#F6F7F2"/>
<circle cx="770.4" cy="740" r="14" fill="#0B1020"/>
<text x="770.4" y="745" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="758.4" y="782" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Screen shows PAID</text>
<text x="758.4" y="804" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A"><tspan x="758.4" dy="0">Only after the display has</tspan><tspan x="758.4" dy="17">really refreshed.</tspan></text>
<rect x="961.6" y="710" width="203.2" height="150" rx="12" fill="#F6F7F2"/>
<circle cx="989.6" cy="740" r="14" fill="#0B1020"/>
<text x="989.6" y="745" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="977.6" y="782" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Screen signs</text>
<text x="977.6" y="804" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A"><tspan x="977.6" dy="0">ed25519 over the contract,</tspan><tspan x="977.6" dy="17">shop and bill id.</tspan></text>
<rect x="1180.8" y="710" width="203.2" height="150" rx="12" fill="#F6F7F2"/>
<circle cx="1208.8" cy="740" r="14" fill="#0B1020"/>
<text x="1208.8" y="745" font-family="Noto Sans Thai" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1196.8" y="782" font-family="Noto Sans Thai" font-size="14" font-weight="600" fill="#0B1020">Contract releases</text>
<text x="1196.8" y="804" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A"><tspan x="1196.8" dy="0">Signature checked on chain,</tspan><tspan x="1196.8" dy="17">then the split is paid.</tspan></text>
<rect x="304" y="876" width="1080" height="44" rx="12" fill="#FDF1DA"/>
<circle cx="328" cy="898" r="6.4" fill="none" stroke="#7A4E00" stroke-width="1.8"/>
<path d="M328 894.4 V898 H330.8" fill="none" stroke="#7A4E00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="348" y="903" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#7A4E00">No signature within 2:00? Anyone can call reclaim and the contract refunds the customer.</text>
</svg>
