<text x="880" y="294" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">Why a signature and not a server flag</text>
<text x="880" y="316" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">The contract checks the device's signature itself, so the</text>
<text x="880" y="334" font-family="Noto Sans Thai" font-size="12" font-weight="400" fill="#5E6B7A">server cannot fake a witness to release money early.</text>
