<text x="304" y="448" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#00704F" text-anchor="start">Open INV-0042 →</text>
<rect id="hotspot__NM-05__2" x="300" y="431" width="120.06" height="25" fill="#000000" fill-opacity="0"/>
<rect id="explain-card" x="280" y="488" width="365.33" height="220" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="324" cy="532" r="20" fill="#EEF0EA"/>
<path d="M325.5 522 L318 533.5 H323.5 L322 542 L330 530 H324.5 Z" fill="#0B1020"/>
<text x="304" y="586" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">It collects itself</text>
<text x="304" y="612" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="304" dy="0">Each paid bill sends the invoice's share straight to</tspan><tspan x="304" dy="20">the supplier's account. You never run a payment</tspan><tspan x="304" dy="20">batch.</tspan></text>
<rect id="explain-card-2" x="661.33" y="488" width="365.33" height="220" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="705.33" cy="532" r="20" fill="#EEF0EA"/>
<path d="M696.33 532 L703.08 538.3 L714.33 526.6" fill="none" stroke="#0B1020" stroke-width="3.24" stroke-linecap="round" stroke-linejoin="round"/>
<text x="685.33" y="586" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">It stops by itself</text>
<text x="685.33" y="612" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="685.33" dy="0">When the funded amount reaches the total, the</tspan><tspan x="685.33" dy="20">server leaves the supplier out of the next bills and</tspan><tspan x="685.33" dy="20">the owner share grows back.</tspan></text>
<rect id="explain-card-3" x="1042.67" y="488" width="365.33" height="220" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<circle cx="1086.67" cy="532" r="20" fill="#EEF0EA"/>
<path d="M1086.67 522 L1094.67 526 V532 Q1094.67 539 1086.67 542 Q1078.67 539 1078.67 532 V526 Z" fill="none" stroke="#0B1020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1083.47 532 L1086.17 534.8 L1090.27 529.8" fill="none" stroke="#0B1020" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1066.67" y="586" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">The supplier can check</text>
<text x="1066.67" y="612" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="1066.67" dy="0">Every share is a token transfer the supplier sees in</tspan><tspan x="1066.67" dy="20">their own account, with the bill it came from in the</tspan><tspan x="1066.67" dy="20">ledger.</tspan></text>
<rect id="note-card" x="280" y="724" width="1128" height="152" rx="12" fill="#F6F7F2" stroke="#DDE2D8" stroke-width="1" stroke-dasharray="6 6"/>
<text x="304" y="764" font-family="Noto Sans Thai" font-size="14" font-weight="700" fill="#0B1020">What this does not do yet</text>
<circle cx="310" cy="792" r="3" fill="#5E6B7A"/>
<text x="324" y="797" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Suppliers on other chains are not paid directly. That is a planned step using chain signatures.</text>
<circle cx="310" cy="820" r="3" fill="#5E6B7A"/>
<text x="324" y="825" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">An invoice is a record in BitPOS plus transfers on NEAR. It is not a legal tax invoice.</text>
<circle cx="310" cy="848" r="3" fill="#5E6B7A"/>
<text x="324" y="853" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">All amounts here are test money on NEAR testnet.</text>
</svg>
