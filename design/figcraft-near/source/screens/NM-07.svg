<rect id="timeline-card" x="280" y="144" width="700" height="796" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<text x="304" y="182" font-family="Noto Sans Thai" font-size="18" font-weight="700" fill="#0B1020">What happened, in order</text>
<line x1="324" y1="236" x2="324" y2="332" stroke="#DDE2D8" stroke-width="2"/>
<circle cx="324" cy="224" r="12" fill="#0B1020"/>
<path d="M318.5 224 L322.62 227.85 L329.5 220.7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="229" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Server froze the quote</text>
<text x="956" y="229" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:41:52</text>
<text x="352" y="252" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Cart priced on the server: 5.00 tUSD = 5,000,000 units. Quote Q-58213.</text>
<line x1="324" y1="352" x2="324" y2="448" stroke="#DDE2D8" stroke-width="2"/>
<circle cx="324" cy="340" r="12" fill="#0B1020"/>
<path d="M318.5 340 L322.62 343.85 L329.5 336.7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="345" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Bill opened on chain</text>
<text x="956" y="345" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:41:53</text>
<text x="352" y="368" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">open_bill by the shop's cashier key: total, five payouts, expiry 10:46:53, witness key of Mini-01.</text>
<text x="352" y="391" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#00704F">1aBc…SAMPLE ↗</text>
<line x1="324" y1="468" x2="324" y2="564" stroke="#DDE2D8" stroke-width="2"/>
<circle cx="324" cy="456" r="12" fill="#00B37E"/>
<path d="M318.5 456 L322.62 459.85 L329.5 452.7" fill="none" stroke="#0B1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="461" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Customer paid, gasless</text>
<text x="956" y="461" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:42:04</text>
<text x="352" y="484" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="352" dy="0">ft_transfer_call of exactly 5.00 tUSD with the bill id. The café's relayer paid the fee. Status</tspan><tspan x="352" dy="19">FINAL.</tspan></text>
<text x="352" y="526" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#00704F">9xQe…SAMPLE ↗</text>
<line x1="324" y1="584" x2="324" y2="680" stroke="#DDE2D8" stroke-width="2"/>
<circle cx="324" cy="572" r="12" fill="#F2A93B"/>
<circle cx="324" cy="572" r="5.6" fill="none" stroke="#0B1020" stroke-width="1.6"/>
<path d="M324 568.85 V572 H326.45" fill="none" stroke="#0B1020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="577" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Held in the bill</text>
<text x="956" y="577" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:42:04</text>
<text x="352" y="600" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Contract state Escrow. The money sits in the contract, not with the shop.</text>
<line x1="324" y1="700" x2="324" y2="796" stroke="#DDE2D8" stroke-width="2"/>
<circle cx="324" cy="688" r="12" fill="#00B37E"/>
<path d="M318.5 688 L322.62 691.85 L329.5 684.7" fill="none" stroke="#0B1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="693" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Table screen witnessed</text>
<text x="956" y="693" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:42:07</text>
<text x="352" y="716" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A"><tspan x="352" dy="0">Mini-01 read the bill from the chain, showed PAID, then signed. The contract checked the</tspan><tspan x="352" dy="19">signature.</tspan></text>
<text x="352" y="758" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#00704F">6dWm…SAMPLE ↗</text>
<circle cx="324" cy="804" r="12" fill="#00B37E"/>
<path d="M318.5 804 L322.62 807.85 L329.5 800.7" fill="none" stroke="#0B1020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="352" y="809" font-family="Noto Sans Thai" font-size="15" font-weight="600" fill="#0B1020">Split paid in one receipt</text>
<text x="956" y="809" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#5E6B7A" text-anchor="end">10:42:07</text>
<text x="352" y="832" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Five transfers in one batch. If any had failed, all would have reverted. State Settled.</text>
<text x="352" y="855" font-family="Noto Sans Thai" font-size="12" font-weight="600" fill="#00704F">6dWm…SAMPLE ↗</text>
