<text x="1020" y="462" font-family="Noto Sans Thai" font-size="14" font-weight="700" fill="#0B1020">Total</text>
<text x="1384" y="462" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020" text-anchor="end">5.00 tUSD</text>
<rect id="checks-card" x="996" y="532" width="412" height="408" rx="12" fill="#FFFFFF" stroke="#DDE2D8" stroke-width="1"/>
<text x="1020" y="570" font-family="Noto Sans Thai" font-size="16" font-weight="700" fill="#0B1020">What the server checked before PAID</text>
<circle cx="1032" cy="602" r="11" fill="#E3F6EE"/>
<path d="M1026.5 602 L1030.62 605.85 L1037.5 598.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="606" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Transaction reached FINAL, not just sent</text>
<circle cx="1032" cy="636" r="11" fill="#E3F6EE"/>
<path d="M1026.5 636 L1030.62 639.85 L1037.5 632.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="640" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Token contract is the allowed tUSD</text>
<circle cx="1032" cy="670" r="11" fill="#E3F6EE"/>
<path d="M1026.5 670 L1030.62 673.85 L1037.5 666.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="674" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Receiver is the bills contract</text>
<circle cx="1032" cy="704" r="11" fill="#E3F6EE"/>
<path d="M1026.5 704 L1030.62 707.85 L1037.5 700.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="708" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Amount equals the frozen quote</text>
<circle cx="1032" cy="738" r="11" fill="#E3F6EE"/>
<path d="M1026.5 738 L1030.62 741.85 L1037.5 734.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="742" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Bill id belongs to this order</text>
<circle cx="1032" cy="772" r="11" fill="#E3F6EE"/>
<path d="M1026.5 772 L1030.62 775.85 L1037.5 768.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="776" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">Contract view says Settled</text>
<circle cx="1032" cy="806" r="11" fill="#E3F6EE"/>
<path d="M1026.5 806 L1030.62 809.85 L1037.5 802.7" fill="none" stroke="#00704F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1054" y="810" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#0B1020">This transaction was not used before</text>
<rect x="1020" y="848" width="364" height="64" rx="12" fill="#F6F7F2"/>
<text x="1040" y="874" font-family="Noto Sans Thai" font-size="13" font-weight="600" fill="#0B1020">A wallet saying "sent" is not proof.</text>
<text x="1040" y="894" font-family="Noto Sans Thai" font-size="13" font-weight="400" fill="#5E6B7A">Only the chain's final receipt is.</text>
