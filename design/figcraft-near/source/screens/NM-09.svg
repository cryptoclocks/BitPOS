<g id="topbar">
<text id="page-title" x="280" y="58" font-family="Noto Sans Thai" font-size="28" font-weight="700" fill="#0B1020">Café CFO</text>
<text id="page-subtitle" x="280" y="84" font-family="Noto Sans Thai" font-size="14" font-weight="400" fill="#5E6B7A">An assistant that reads your ledger privately and proposes. It cannot move money or approve.</text>
<g id="testnet-marker">
<rect x="1300.52" y="30" width="107.48" height="24" rx="12" fill="#FFFFFF" stroke="#0B1020" stroke-width="1"/>
<circle cx="1314.52" cy="42" r="4" fill="#F2A93B"/>
